name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: '17 5 * * *' # Daily at 10:17 UTC+5; GitHub may delay scheduled runs.
  workflow_dispatch:
  # Validate the first installation on its branch before publishing to main.
  # SVG commits do not match this path, so they cannot create a push loop.
  push:
    paths:
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'bekzatwr/bekzatwr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}

      - name: Generate real contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: bekzatwr

      - name: Validate the light and dark SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ('profile-night-rainbow.svg', 'profile-season.svg'):
              path = Path('profile-3d-contrib') / name
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert len(list(root.iter())) > 100, f'Unexpectedly empty SVG: {path}'
              print(f'Validated {path}: {path.stat().st_size:,} bytes')
          PY

      - name: Commit and push generated SVGs only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile-3d-contrib/*.svg
          if git diff --cached --quiet; then
            echo 'Contribution SVGs are already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh 3D contribution calendars'
          git push
