<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Typewriter Intro">
  <defs>
    <linearGradient id="ti-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="ts-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#5cffd9" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#5cffd9" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#5cffd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ts-sphere" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0"   stop-color="#1a2a52"/>
      <stop offset="0.6" stop-color="#0a0f24"/>
      <stop offset="1"   stop-color="#040614"/>
    </radialGradient>
    <radialGradient id="ts-shine" cx="0.3" cy="0.25" r="0.3">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ts-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cffd9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ts-soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    </defs>

  <rect width="1200" height="420" fill="url(#ti-stage)"/>

  <!-- Terminal window -->
  <g filter="url(#ti-shadow)">
    <rect x="80" y="40" width="1040" height="340" rx="14" fill="#11131c"/>
    <!-- Title bar -->
    <rect x="80" y="40" width="1040" height="38" rx="14" fill="#1c1f2e"/>
    <rect x="80" y="60" width="1040" height="18" fill="#1c1f2e"/>
    <line x1="80" y1="78" x2="1120" y2="78" stroke="#0a0c14" stroke-width="0.6"/>
  </g>

  <!-- Traffic lights -->
  <circle cx="106" cy="59" r="6.5" fill="#ff5f56"/>
  <circle cx="128" cy="59" r="6.5" fill="#ffbd2e"/>
  <circle cx="150" cy="59" r="6.5" fill="#27c93f"/>

  <!-- Window title -->
  <text x="600" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a7f99" letter-spacing="2">~/bekzatwr — zsh — 124×34</text>

  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14">
    <!-- Prompt 1 -->
    <text x="110" y="112" fill="#a78bfa">bekzatwr@dev</text>
    <text x="220" y="112" fill="#7a7f99">:</text>
    <text x="226" y="112" fill="#7ee787">~</text>
    <text x="236" y="112" fill="#7a7f99">$</text>
    <text x="248" y="112" fill="#c9d1d9">whoami --verbose</text>
    <text x="110" y="134" fill="#c9d1d9">↳ Bekzat Zhorabek — AI &amp; Software Engineering student / developer</text>
    <text x="110" y="152" fill="#7a7f99">  Python · FastAPI · PostgreSQL · React · TypeScript · Docker</text>

    <!-- Prompt 2 -->
    <text x="110" y="182" fill="#a78bfa">bekzatwr@dev</text>
    <text x="220" y="182" fill="#7a7f99">:</text>
    <text x="226" y="182" fill="#7ee787">~</text>
    <text x="236" y="182" fill="#7a7f99">$</text>
    <text x="248" y="182" fill="#c9d1d9">cat now.md</text>
    <text x="110" y="204" fill="#fcd34d">## currently</text>
    <text x="110" y="224" fill="#c9d1d9">- AI-powered applications</text>
    <text x="110" y="242" fill="#c9d1d9">- Backend development and APIs</text>
    <text x="110" y="260" fill="#c9d1d9">- Team projects and system integration</text>

    <!-- Prompt 3 -->
    <text x="110" y="290" fill="#a78bfa">bekzatwr@dev</text>
    <text x="220" y="290" fill="#7a7f99">:</text>
    <text x="226" y="290" fill="#7ee787">~</text>
    <text x="236" y="290" fill="#7a7f99">$</text>
    <text x="248" y="290" fill="#c9d1d9">contact --all</text>
    <text x="110" y="312" fill="#58a6ff">→ https://github.com/bekzatwr</text>
    <text x="220" y="312" fill="#58a6ff"></text>
    <text x="320" y="312" fill="#58a6ff"></text>
    <text x="430" y="312" fill="#58a6ff"></text>

    <!-- Final prompt with cursor -->
    <text x="110" y="342" fill="#a78bfa">bekzatwr@dev</text>
    <text x="220" y="342" fill="#7a7f99">:</text>
    <text x="226" y="342" fill="#7ee787">~</text>
    <text x="236" y="342" fill="#7a7f99">$</text>
    <rect x="252" y="330" width="9" height="14" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Original Tech Sphere: right-hand artwork only -->
  <g transform="translate(900,218) scale(0.60)">
    <!-- Halo -->
    <circle r="220" fill="url(#ts-halo)"/>
    <!-- Sphere base -->
    <circle r="160" fill="url(#ts-sphere)"/>
    <!-- Specular shine -->
    <circle r="160" fill="url(#ts-shine)"/>
    <!-- Rim light -->
    <circle r="160" fill="none" stroke="url(#ts-rim)" stroke-width="1.2"/>

    <!-- Latitude ellipses (rotating group) -->
    <g filter="url(#ts-soft)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#5cffd9" stroke-width="0.6" opacity="0.5"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#5cffd9" stroke-width="0.6" opacity="0.4" transform="rotate(60)"/>
      <ellipse rx="160" ry="60" fill="none" stroke="#5cffd9" stroke-width="0.6" opacity="0.4" transform="rotate(120)"/>
      <ellipse rx="160" ry="20" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
      <ellipse rx="160" ry="100" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
      <ellipse rx="60" ry="160" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.35"/>
      <ellipse rx="120" ry="160" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.35"/>
    </g>

    <!-- Tech tokens (counter-rotating to stay readable) -->
    <g font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite"/>
      <g transform="translate(-135,-24)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">react</text>
      </g>
      <g transform="translate(-69,-119)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">ts</text>
      </g>
      <g transform="translate(-105,88)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">python</text>
      </g>
      <g transform="translate(98,57)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">fastapi</text>
      </g>
      <g transform="translate(10,113)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">docker</text>
      </g>
      <!-- The two innermost sit on the right, where a right-hand label would
           straddle the rim — so this one reads back toward its own dot. -->
      <g transform="translate(86,-31)">
        <circle r="3" fill="#a78bfa"/>
        <text x="-10" y="4" text-anchor="end" fill="#a78bfa">postgres</text>
      </g>
      <g transform="translate(39,-83)">
        <circle r="3" fill="#a78bfa"/>
        <text x="10" y="4" fill="#a78bfa">AI</text>
      </g>
      <g transform="translate(18,26)" opacity="0.7">
        <text x="0" y="0" font-style="italic" fill="#fef3c7">// learning</text>
      </g>
    </g>

    <!-- Center node -->
    <circle r="5" fill="#fef3c7">
      <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#fef3c7" stroke-width="0.6" opacity="0.5">
      <animate attributeName="r" values="14;22;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Status strip, inside the window rather than sitting on its edge. -->
  <rect x="80" y="358" width="1040" height="22" rx="14" fill="#171a26"/>
  <rect x="80" y="358" width="1040" height="12" fill="#171a26"/>
  <line x1="80" y1="358" x2="1120" y2="358" stroke="#0a0c14" stroke-width="0.6"/>
  <g transform="translate(80,373)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5a5f7a">
    <text x="30" y="0">UTF-8</text>
    <text x="96" y="0">zsh</text>
    <text x="156" y="0">ctrl-l · clear</text>
    <text x="1010" y="0" text-anchor="end" fill="#7ee787">● connected</text>
  </g>
</svg>
